# Records the demo walkthroughs in demo/scenarios. The work is done by the
# Dagger module in dagger/, so this is the same command you run locally:
#
#   make docs
#
# Recordings are uploaded as an artifact on every run and committed to
# docs/assets only when a release is published.
name: demos

on:
  pull_request:
    paths:
      - "demo/**"
      - "dagger/**"
      - "dagger.json"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/demos.yml"
      - ".github/actions/setup-dagger/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A release checks out a tag; commit the recordings to the default
          # branch instead.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - id: dagger
        uses: $/.github/actions/setup-dagger

      - name: Record
        run: |
          rm -rf docs/assets
          make docs DAGGER="$HOME/.local/bin/dagger"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demos
          path: docs/assets

      - name: Commit recordings
        if: github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          git diff --cached --quiet && exit 0
          git commit -m "Update demo recordings for ${{ github.event.release.tag_name }}"
          git push
