# Records the demo walkthroughs in demo/scenarios, and checks the committed
# recordings are up to date when a release is tagged. The work is done by
# the Dagger module in dagger/ and the Makefile, so these are the same
# commands you run locally:
#
#   make docs
#   make docs-check
#
# Recordings are committed by hand, before a release is tagged; the
# pre-push hook (`make hooks`) offers to record them again when they're out
# of date. On a pull request they are recorded and uploaded as an artifact,
# to look at. Nothing here writes to the repository.
name: demos

on:
  pull_request:
    paths:
      - "demo/**"
      - "dagger/**"
      - "dagger.json"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/demos.yml"
      - ".github/actions/setup-dagger/**"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: dagger
        uses: $/.github/actions/setup-dagger

      - name: Record
        run: |
          rm -rf docs/assets
          make docs DAGGER="$HOME/.local/bin/dagger"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demos
          path: docs/assets

  # A release tagged without the hook, or from GitHub's release page, still
  # gets checked: this fails if the recordings at the tag are out of date.
  fresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the recordings are up to date
        run: make docs-check
