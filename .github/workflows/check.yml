# Static checks on every pull request and every push to main. The work is
# done by the Dagger module in dagger/, so each job is the same command you
# run locally:
#
#   make lint
#   make vulncheck
#   make zizmor
#
# Any finding fails the job. New vulnerabilities are published without
# the code changing, so the checks also run weekly against main.
name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: dagger
        uses: $/.github/actions/setup-dagger

      - name: Lint
        env:
          DAGGER: ${{ steps.dagger.outputs.dagger }}
        run: make lint

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: dagger
        uses: $/.github/actions/setup-dagger

      - name: Vulncheck
        env:
          DAGGER: ${{ steps.dagger.outputs.dagger }}
        run: make vulncheck

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: dagger
        uses: $/.github/actions/setup-dagger

      - name: Zizmor
        env:
          DAGGER: ${{ steps.dagger.outputs.dagger }}
          # Read-only, for the audits that look actions up on GitHub.
          GH_TOKEN: ${{ github.token }}
        run: make zizmor
