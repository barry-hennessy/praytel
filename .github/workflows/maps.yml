# Keeps two architecture maps honest, using the praytel built from the same
# commit (see docs/guides/maps.md and CONTRIBUTING.md):
#
#   arch                      praytel's own, from its --self-trace spans
#   demo/workloads/shop/arch  the demo shop's, from its tests
#
# Locally:
#
#   make map        re-stamp both, then commit them
#   make map-diff   draw how they differ from main's
#
# Two jobs, one question each:
#
#   current  Do the committed maps match what the code does? This runs the
#            shop's tests under praytel under praytel, so it catches an
#            unreviewed change to praytel's own wiring, and praytel
#            mis-joining or dropping the shop's spans.
#   diff     What does this pull request change in either architecture?
#            This runs no tests, only compares the base branch's committed
#            maps with this one's, and draws the result in the job summary.
name: maps

on:
  pull_request:
    paths:
      - "arch/**"
      - "cmd/**"
      - "internal/**"
      - "demo/workloads/shop/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/maps.yml"
  push:
    branches: [main]
    paths:
      - "arch/**"
      - "cmd/**"
      - "internal/**"
      - "demo/workloads/shop/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/maps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            demo/workloads/shop/go.sum

      - name: Stamp the maps
        run: make map

      - name: Check they match the committed maps
        run: |
          git add --intent-to-add arch demo/workloads/shop/arch
          if ! git diff --exit-code -- arch demo/workloads/shop/arch; then
            echo "::error::An architecture map is out of date. Run 'make map' and commit arch and demo/workloads/shop/arch."
            exit 1
          fi

  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Draw the changes
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          for dir in arch demo/workloads/shop/arch; do
            make -s map-diff BASE="$BASE" MAP_DIRS="$dir" | tee map-diff.txt
            {
              echo "## Architecture map: \`$dir\`"
              echo
              if [ "$(head -n 1 map-diff.txt)" = "no changes" ]; then
                echo "No changes against \`$BASE\`."
              else
                echo "Changes against \`$BASE\`:"
                echo
                echo '```mermaid'
                make -s map-diff BASE="$BASE" MAP_DIRS="$dir" MAP_FORMAT=mermaid
                echo '```'
                echo
                echo '<details><summary>As text</summary>'
                echo
                echo '```'
                cat map-diff.txt
                echo '```'
                echo
                echo '</details>'
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
