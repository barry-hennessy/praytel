# Scores the repository against the OpenSSF Scorecard's supply-chain
# checks: branch protection, pinned dependencies, token permissions,
# dependency updates, static analysis, a security policy and so on. Each
# result lands in the Security tab's code scanning alerts, with what to do
# about it.
#
# Results aren't published to https://scorecard.dev yet. To publish them,
# and get a badge (https://api.scorecard.dev/projects/github.com/barry-hennessy/praytel/badge),
# set publish_results to true and give the job id-token: write, which
# scorecard.dev uses to check the results came from this workflow. It only
# accepts them from a workflow kept to the shape it can trust, as this one
# is: read-only by default, no top-level env, and only checkout,
# upload-artifact, upload-sarif and the scorecard action itself.
name: scorecard

on:
  # Branch protection only shows up in its check when it changes.
  branch_protection_rule:
  schedule:
    - cron: "31 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # To upload the results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
