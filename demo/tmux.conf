# tmux configuration for demo recordings. The status line is a caption bar:
# a tape presses prefix (Ctrl-B) then a digit to show that line of the
# scenario's captions.txt, and prefix then 0 to clear it.

set -g default-terminal "screen-256color"
set -g escape-time 0

set -g status 2
set -g status-position top
set -g status-interval 0
set -g status-style "bg=colour24,fg=colour231"
set -g @caption ""
set -g status-format[0] "#[align=centre,bold]#{@caption}"
set -g status-format[1] "#[bg=default]"

bind 0 run-shell -b "demo-caption 0"
bind 1 run-shell -b "demo-caption 1"
bind 2 run-shell -b "demo-caption 2"
bind 3 run-shell -b "demo-caption 3"
bind 4 run-shell -b "demo-caption 4"
bind 5 run-shell -b "demo-caption 5"
bind 6 run-shell -b "demo-caption 6"
bind 7 run-shell -b "demo-caption 7"
bind 8 run-shell -b "demo-caption 8"
bind 9 run-shell -b "demo-caption 9"
